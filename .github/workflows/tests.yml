name: Unit tests

on:
  pull_request:
  push:
    branches:
      - 10.*

jobs:
  phpunit:
    name: "PHPUnit"
    runs-on: "ubuntu-20.04"

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3", "8,4", "8,5" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v2"

      - name: Run tests
        run: vendor/bin/phpunit
